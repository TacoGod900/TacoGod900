name: Update contribution graph

on:
  schedule:
    - cron: "17 0 * * *"   # daily, just after midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [assets/render_graph.py, .github/workflows/activity-graph.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Render graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 assets/render_graph.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          git diff --cached --quiet || (git commit -m "Update contribution graph" && git push)
